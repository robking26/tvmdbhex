# Downloads the palette test-set posters (tools/palette_testset.json) from TMDB and
# commits them to the `palette-fixtures` branch, so palette tuning can run against
# real posters in environments that can't reach TMDB. Manual only.
name: Palette fixtures

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Download posters
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python tools/fetch_fixtures.py tools/palette_testset.json "$RUNNER_TEMP/fixtures"
      - name: Commit to palette-fixtures branch
        run: |
          cd "$RUNNER_TEMP/fixtures"
          git init -q -b palette-fixtures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Poster test fixtures for palette tuning (TMDB w342). Generated by .github/workflows/palette-fixtures.yml.\n' > README.md
          git add -A
          git commit -qm "Palette test fixtures"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" palette-fixtures
