[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvmdbhex"
version = "0.1.0"
description = "Dominant poster colours (primary/secondary/tertiary hex) for every TMDB movie and TV series, served over HTTP."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pillow>=10",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
tvmdbhex = "tvmdbhex.cli:main"

[tool.setuptools.packages.find]
include = ["tvmdbhex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
